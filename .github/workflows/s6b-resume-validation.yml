name: S6B Resume Validation

on:
  push:
    branches:
      - feat/s6b-deterministic-resume-executor-20260904
  pull_request:
    branches:
      - repair/self-contained-canonical-20260901
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Focused S6B continuation/resume tests
        run: python -m pytest -q tests/test_s6b_continuation.py tests/test_s6b_resume_executor.py
      - name: Full test suite
        run: python -m pytest -q
